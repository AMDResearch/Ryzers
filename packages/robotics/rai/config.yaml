# No init_image pin: rai needs a Python 3.12 ROCm base (rai_core requires numpy<2,
# which ships no cp313 wheels, and every cp313 opencv-python needs numpy>=2), and
# the repo default is already rocm10.1 py3.12. Re-pin here if the default ever
# moves to py3.13.

port_mappings:
  - "8501:8501"   # Streamlit frontend

# Uncomment to set your OpenAI API key
# environment_variables:
# - "OPENAI_API_KEY=your-api-key-here"

volume_mappings:                                                                                                                                                                      
  # Persist benchmark results after container exits 
  - "$PWD/experiments:/ryzers/rai/src/rai_bench/rai_bench/experiments"
