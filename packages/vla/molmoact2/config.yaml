### ryzers build options

init_image: "ryzerdocker:latest"

build_arguments:
- "MOLMOACT2_COMMIT=cdf4b7728e0545366bf3366639fd86477ef59d04"
- "LEROBOT_REF=molmoact2-hf-inference"

### ryzers run options

gpu_support: true
x11_display: false

# Weights and datasets download once into the persistent HF cache volume. Artifacts
# land under /outputs.
environment_variables:
- "HSA_OVERRIDE_GFX_VERSION=11.5.1"
- "HF_HOME=/root/.cache/huggingface"
- "HF_HUB_ENABLE_HF_TRANSFER=1"
- "HF_HUB_DISABLE_TELEMETRY=1"
- "TOKENIZERS_PARALLELISM=false"
- "MUJOCO_GL=egl"
- "PYOPENGL_PLATFORM=egl"
# ROCm perf levers for gfx1151: AOTriton flash SDPA on, hipBLASLt off (rocBLAS is faster
# for these GEMM shapes).
- "TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1"
- "TORCH_BLAS_PREFER_HIPBLASLT=0"
- "OUT_DIR=/outputs"
# Per-demo knobs (override from the host: VAR=... ryzers run /ryzers/demo_*.sh).
# Blank lets each demo pick a random episode or scene.
- 'SEED=${SEED:-}'
- 'EPISODE=${EPISODE:-}'
- 'SUITE=${SUITE:-}'
- 'TASK_ID=${TASK_ID:-}'
- 'THINK=${THINK:-}'
- 'HF_TOKEN=${HF_TOKEN:-}'
# Interactive demo knobs.
- 'PORT=${PORT:-}'
- 'VIEW_RES=${VIEW_RES:-}'
- 'VIDEO_RES=${VIDEO_RES:-}'
- 'RT_HZ=${RT_HZ:-}'
- 'RT_LOOKAHEAD=${RT_LOOKAHEAD:-}'
- 'RT_MAX_STEPS=${RT_MAX_STEPS:-}'
# Flow-matching denoising steps (lower is a bit faster). Blank uses the model default.
- 'NUM_STEPS=${NUM_STEPS:-}'
# RT_HORIZON_MULT extends the sim horizon so long tasks do not reset mid-execution.
- 'RT_HORIZON_MULT=${RT_HORIZON_MULT:-}'

volume_mappings:
- "$PWD/workspace/molmoact2/outputs:/outputs"
- "$PWD/workspace/molmoact2/models:/models"
- "$PWD/workspace/.cache/huggingface:/root/.cache/huggingface"

# Host networking so the interactive demo's browser server is reachable on localhost.
docker_extra_run_flags: "--shm-size=16g --ipc=host --network=host"
