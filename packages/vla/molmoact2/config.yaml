### ryzers build options

# Public, pullable ROCm+PyTorch base (== ryzers.RYZERS_DEFAULT_INIT_IMAGE; the same image
# ryzerdocker was built from). A locally-built tag here (e.g. ryzerdocker:latest from the
# dreamzero sim project) breaks `ryzers build molmoact2` on a fresh machine with "pull
# access denied ... ryzerdocker:latest". MolmoAct2 installs its own mujoco/robosuite (via
# lerobot[libero]) + egl/osmesa libs, so it needs only this ROCm torch base for gfx1151.
init_image: "rocm/pytorch:rocm7.2.2_ubuntu24.04_py3.12_pytorch_release_2.10.0"

# Pin the upstream MolmoAct2 source the inference path was validated against.
build_arguments:
- "MOLMOACT2_COMMIT=cdf4b7728e0545366bf3366639fd86477ef59d04"
- "LEROBOT_REF=molmoact2-hf-inference"

### ryzers run options

gpu_support: true
x11_display: false

# Weights and HF datasets are NOT baked into the image; they download once into
# the persistent /root/.cache/huggingface volume and are reused across runs.
# Artifacts (videos + joint-angle plots) land under /outputs.
environment_variables:
- "HSA_OVERRIDE_GFX_VERSION=11.5.1"
- "HF_HOME=/root/.cache/huggingface"
# HF download backend. Xet (*.xethub.hf.co) is a SEPARATE host from huggingface.co
# and is commonly blocked/throttled on corporate networks, which hangs a shard
# mid-download (looks like "stuck at 4/5"). Default to the classic, resumable HTTPS
# path (hf_transfer-accelerated) that only needs huggingface.co. On a fast network
# you can re-enable Xet: HF_HUB_DISABLE_XET=0 ryzers run ...
- 'HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}'
- 'HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-1}'
- 'HF_HUB_DOWNLOAD_TIMEOUT=${HF_HUB_DOWNLOAD_TIMEOUT:-60}'
- "HF_HUB_DISABLE_TELEMETRY=1"
- "TOKENIZERS_PARALLELISM=false"
- "MUJOCO_GL=egl"
- "PYOPENGL_PLATFORM=egl"
# ROCm perf levers for gfx1151.
- "TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1"
- "TORCH_BLAS_PREFER_HIPBLASLT=0"
- "OUT_DIR=/outputs"
# Per-demo knobs (override from the host: VAR=... ryzers run /ryzers/demo_*.sh).
# Leave blank to let each demo pick a random episode or scene.
- 'SEED=${SEED:-}'
- 'EPISODE=${EPISODE:-}'
- 'SUITE=${SUITE:-}'
- 'TASK_ID=${TASK_ID:-}'
- 'THINK=${THINK:-}'
- 'HF_TOKEN=${HF_TOKEN:-}'
# Interactive demo (demo_interactive.sh / demo_interactive_rt.sh) knobs.
- 'PORT=${PORT:-}'
- 'VIEW_RES=${VIEW_RES:-}'
- 'VIDEO_RES=${VIDEO_RES:-}'
- 'RT_HZ=${RT_HZ:-}'
- 'RT_LOOKAHEAD=${RT_LOOKAHEAD:-}'
- 'RT_MAX_STEPS=${RT_MAX_STEPS:-}'
# Flow-matching denoising steps (lower = a bit faster inference). Blank = model default.
- 'NUM_STEPS=${NUM_STEPS:-}'
# Real-time demo horizon extension for long tasks.
- 'RT_HORIZON_MULT=${RT_HORIZON_MULT:-}'
# Cross-embodiment demo knobs.
- 'EMBODIMENT=${EMBODIMENT:-}'
- 'EMBODIMENT_GRIPPER=${EMBODIMENT_GRIPPER:-}'
- 'EMBODIMENT_EXECUTOR=${EMBODIMENT_EXECUTOR:-}'
- 'EMBODIMENT_SERVO_STEPS=${EMBODIMENT_SERVO_STEPS:-}'
- 'EMBODIMENT_POS_SCALE=${EMBODIMENT_POS_SCALE:-}'
- 'EMBODIMENT_ROT_SCALE=${EMBODIMENT_ROT_SCALE:-}'
- 'EMBODIMENT_XARM6_CAMERA_MATCH=${EMBODIMENT_XARM6_CAMERA_MATCH:-}'
- 'EMBODIMENT_UR5E_ROBOTIQ_INIT_BLEND=${EMBODIMENT_UR5E_ROBOTIQ_INIT_BLEND:-}'
- 'EMBODIMENT_UR5E_ROBOTIQ_EEF_OFFSET=${EMBODIMENT_UR5E_ROBOTIQ_EEF_OFFSET:-}'
- 'EMBODIMENT_UR5E_ROBOTIQ_CAMERA_OFFSET=${EMBODIMENT_UR5E_ROBOTIQ_CAMERA_OFFSET:-}'
# Cross-embodiment fine-tuning knobs read by embodiment.py (IK/OSC/servo for the
# non-Panda arms). Blank => the in-code default; set per run to tune, e.g.
#   EMBODIMENT=xarm6 EMBODIMENT_IK_DAMPING=0.1 ryzers run /ryzers/demo_*.sh
- 'EMBODIMENT_ROT_DEG=${EMBODIMENT_ROT_DEG:-}'
- 'EMBODIMENT_CONTROL_FREQ=${EMBODIMENT_CONTROL_FREQ:-}'
- 'EMBODIMENT_SERVO_POS_TOL=${EMBODIMENT_SERVO_POS_TOL:-}'
- 'EMBODIMENT_SERVO_ROT_TOL=${EMBODIMENT_SERVO_ROT_TOL:-}'
- 'EMBODIMENT_OSC_KP=${EMBODIMENT_OSC_KP:-}'
- 'EMBODIMENT_OSC_DR=${EMBODIMENT_OSC_DR:-}'
- 'EMBODIMENT_IK_ORI_WEIGHT=${EMBODIMENT_IK_ORI_WEIGHT:-}'
- 'EMBODIMENT_IK_DAMPING=${EMBODIMENT_IK_DAMPING:-}'
- 'EMBODIMENT_IK_MAX_DQ=${EMBODIMENT_IK_MAX_DQ:-}'
- 'EMBODIMENT_IK_POSTURE_GAIN=${EMBODIMENT_IK_POSTURE_GAIN:-}'
- 'EMBODIMENT_IK_LIMIT_GAIN=${EMBODIMENT_IK_LIMIT_GAIN:-}'
- 'EMBODIMENT_IK_LIMIT_MARGIN=${EMBODIMENT_IK_LIMIT_MARGIN:-}'
- 'EMBODIMENT_IK_SINGULAR_LOWER=${EMBODIMENT_IK_SINGULAR_LOWER:-}'
- 'EMBODIMENT_IK_SINGULAR_HARD=${EMBODIMENT_IK_SINGULAR_HARD:-}'
- 'XARM6_ROBOT_XML=${XARM6_ROBOT_XML:-}'

volume_mappings:
- "$PWD/workspace/molmoact2/outputs:/outputs"
- "$PWD/workspace/molmoact2/models:/models"
- "$PWD/workspace/.cache/huggingface:/root/.cache/huggingface"

# --network=host, --ipc=host, and --shm-size 16G are provided by the Ryzer default
# run flags. Repeating them here makes Docker reject the run.
