# ROCm 7.14 base (rocm/pytorch torch 2.10.0), the current standard for these ports.
init_image: rocm/pytorch:rocm7.14_ubuntu24.04_py3.12_pytorch_release_2.10.0
# This is a model-agnostic simulator base; chain a policy on top with
#   ryzers build simulation/robotwin <policy>

gpu_support: true
x11_display: false

environment_variables:
- "HSA_OVERRIDE_GFX_VERSION=11.5.1"
- "TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1"
- "TORCH_BLAS_PREFER_HIPBLASLT=0"
- "HF_HOME=/root/.cache/huggingface"
- 'HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}'
- 'HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-0}'
- 'HF_HUB_DOWNLOAD_TIMEOUT=${HF_HUB_DOWNLOAD_TIMEOUT:-60}'
- "HF_HUB_DISABLE_TELEMETRY=1"
- "TOKENIZERS_PARALLELISM=false"
- 'HF_TOKEN=${HF_TOKEN:-}'
- "ROBOTWIN_ROOT=/opt/RoboTwin"
# Assets live under a distinct container path (/sim_models) so this base's models mount
# does not collide with a policy layer's /models (weights) when chained (ryzers concatenates
# volume mappings and Docker rejects two mounts to the same container path).
- "ROBOTWIN_ASSETS_DIR=/sim_models/robotwin_assets"
# Distinct container target so this base's outputs mount does not collide with a
# policy layer's /outputs when chained (ryzers concatenates volume mappings). When a
# policy (e.g. fastwam) is chained on top, its /outputs wins for the policy demos.
- "OUT_DIR=/sim_outputs"
# Sim/harness knobs (override from the host: VAR=... ryzers run /ryzers/demos/demo_*.sh).
- 'TASK=${TASK:-}'
- 'TASK_CONFIG=${TASK_CONFIG:-}'
- 'SEED=${SEED:-}'
- 'NUM_EPISODES=${NUM_EPISODES:-}'
- 'PORT=${PORT:-}'
- 'VIEW_RES=${VIEW_RES:-}'
- 'VIDEO_RES=${VIDEO_RES:-}'
- 'RT_HZ=${RT_HZ:-}'
- 'MAX_STEPS=${MAX_STEPS:-}'
# Policy selection: module:function returning a sim_robotwin.Policy (default RandomPolicy).
- 'POLICY_FACTORY=${POLICY_FACTORY:-}'

volume_mappings:
- "$PWD/workspace/simulation-robotwin/outputs:/sim_outputs"
- "$PWD/workspace/simulation-robotwin/models:/sim_models"
- "$PWD/workspace/.cache/huggingface:/root/.cache/huggingface"
