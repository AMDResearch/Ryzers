#
# Local single-machine deployment of the full Flower federation:
#
#   superlink ─┬─ serverapp  (flower-superexec --plugin-type serverapp)
#              ├─ supernode-0 ── clientapp-0 (flower-superexec --plugin-type clientapp)
#              └─ supernode-1 ── clientapp-1 (flower-superexec --plugin-type clientapp)
#
# All components run insecure (no TLS) on a shared bridge network so they
# can address each other by service name.
#
# Prerequisites: build the three role images first (the chained builds
# also build flower-base implicitly):
#
#   ryzers build flower-base flower-superlink
#   ryzers build flower-base flower-supernode
#   ryzers build flower-base flower-superexec
#
# Then from this directory:
#
#   docker compose up --abort-on-container-exit
#
# Submit a run from the host (requires `pip install flwr` on the host):
#
#   flwr run ../flower-superexec/app local-federation
#
# (Add a `[tool.flwr.federations.local-federation]` block in the app's
#  pyproject.toml pointing at superlink address 127.0.0.1:9093.)

services:

  superlink:
    image: flower-superlink:latest
    container_name: flower-superlink
    networks: [flower]
    ports:
      - "9091:9091"   # ExecApi (host-side flwr CLI)
      - "9092:9092"   # FleetApi
      - "9093:9093"   # ServerAppIo
    environment:
      FLOWER_INSECURE: "1"
      FLOWER_ISOLATION: process
      FLOWER_STATE_DB: /app/state/state.db
    volumes:
      - ./state:/app/state

  serverapp:
    image: flower-superexec:latest
    container_name: flower-serverapp
    networks: [flower]
    depends_on: [superlink]
    environment:
      FLOWER_PLUGIN_TYPE: serverapp
      FLOWER_APPIO_ADDR: superlink:9091
      FLOWER_INSECURE: "1"

  supernode-0:
    image: flower-supernode:latest
    container_name: flower-supernode-0
    networks: [flower]
    depends_on: [superlink]
    environment:
      SUPERLINK_IP: superlink
      FLOWER_INSECURE: "1"
      FLOWER_PARTITION_ID: "0"
      FLOWER_NUM_PARTITIONS: "2"
      FLOWER_CLIENTAPPIO: 0.0.0.0:9094
      FLOWER_ISOLATION: process

  clientapp-0:
    image: flower-superexec:latest
    container_name: flower-clientapp-0
    networks: [flower]
    depends_on: [supernode-0]
    # GPU passthrough so PyTorch ROCm is usable
    devices:
      - /dev/kfd
      - /dev/dri
    group_add: [video, render]
    security_opt: [seccomp=unconfined]
    environment:
      FLOWER_PLUGIN_TYPE: clientapp
      FLOWER_APPIO_ADDR: supernode-0:9094
      FLOWER_INSECURE: "1"

  supernode-1:
    image: flower-supernode:latest
    container_name: flower-supernode-1
    networks: [flower]
    depends_on: [superlink]
    environment:
      SUPERLINK_IP: superlink
      FLOWER_INSECURE: "1"
      FLOWER_PARTITION_ID: "1"
      FLOWER_NUM_PARTITIONS: "2"
      FLOWER_CLIENTAPPIO: 0.0.0.0:9094
      FLOWER_ISOLATION: process

  clientapp-1:
    image: flower-superexec:latest
    container_name: flower-clientapp-1
    networks: [flower]
    depends_on: [supernode-1]
    devices:
      - /dev/kfd
      - /dev/dri
    group_add: [video, render]
    security_opt: [seccomp=unconfined]
    environment:
      FLOWER_PLUGIN_TYPE: clientapp
      FLOWER_APPIO_ADDR: supernode-1:9094
      FLOWER_INSECURE: "1"

networks:
  flower:
    driver: bridge
