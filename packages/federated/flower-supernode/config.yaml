# The SuperNode itself does not run training; it just orchestrates the
# paired ClientApp superexec. GPU support is left enabled (default) so
# that running on the same host as the superexec is straightforward, but
# you can flip it off if running them in separate containers.

port_mappings:
- "9094:9094"   # ClientAppIo (local superexec connects here)

volume_mappings:
- "$PWD/workspace/flower/superlink-certificates:/app/certificates:ro"

# SUPERLINK_IP is consumed by the run-time CMD override:
#   ryzers run flower-supernode --superlink ${SUPERLINK_IP}:9092 ...
environment_variables:
- "SUPERLINK_IP=127.0.0.1"
