# The SuperNode itself does not run training; it just orchestrates the
# paired ClientApp superexec. GPU support is left enabled (default) so
# that running on the same host as the superexec is straightforward, but
# you can flip it off if running them in separate containers.

port_mappings:
- "9094:9094"   # ClientAppIo (local superexec connects here)

volume_mappings:
- "$PWD/workspace/flower/superlink-certificates:/app/certificates:ro"

# Consumed by /ryzers/run-supernode.sh. Override by exporting the same
# variables in your shell before `ryzers run`. SUPERLINK_IP is the most
# important one — set it to the routable IP of your SuperLink host.
environment_variables:
- "SUPERLINK_IP=${SUPERLINK_IP:-127.0.0.1}"
- "FLOWER_INSECURE=${FLOWER_INSECURE:-1}"
- "FLOWER_PARTITION_ID=${FLOWER_PARTITION_ID:-0}"
- "FLOWER_NUM_PARTITIONS=${FLOWER_NUM_PARTITIONS:-2}"
