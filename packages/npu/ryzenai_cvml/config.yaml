environment_variables:
# ROCm 7.2.2 natively supports the Ryzen AI iGPUs, so HSA_OVERRIDE_GFX_VERSION
# is no longer forced. On older ROCm or with detection issues, set it per
# silicon (Phoenix=11.0.0, Strix Point=11.5.0, Strix Halo=11.5.1, Krackan=11.5.2).
- "RYZEN_AI_DIR=/ryzers/RyzenAI-SW/Ryzen-AI-CVML-Library"
- "LD_LIBRARY_PATH=/ryzers/RyzenAI-SW/Ryzen-AI-CVML-Library/linux:/opt/xilinx/xrt/lib"

docker_extra_run_flags:
    - "--device=/dev/accel/accel0:/dev/accel/accel0"
    - "--ulimit memlock=-1"
#    - "--device=/dev/video0:/dev/video0" # set this to your camera device
